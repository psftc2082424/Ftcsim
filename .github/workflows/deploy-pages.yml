# Build the simulator and publish it to GitHub Pages.
#
# The build job runs the repository's own scripts rather than reimplementing
# them here: `verify` is typecheck + ESLint + the full Vitest suite, and it runs
# before `build` so a broken commit never reaches the published site.
#
# Deployment uses the artifact flow (`upload-pages-artifact` / `deploy-pages`)
# rather than pushing to a `gh-pages` branch, so the repository history stays
# free of build output and Jekyll never runs over `dist/`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So the site can be republished without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
#
# Named distinctly rather than `pages`, which is what GitHub's own built-in
# "pages build and deployment" workflow uses. While Pages was briefly set to
# deploy from a branch, both workflows ran on every push and shared that group,
# and runs sat queued behind each other until they failed at startup.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires >= 20.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck + lint + tests, exactly as run locally.
      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      # Needs Pages already switched on for the repository, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      #
      # This step cannot do that itself. Enabling it from the API was tried and
      # fails twice over: the workflow's own token answers "Resource not
      # accessible by integration", and the repository owner's credential
      # answers "Your current plan does not support GitHub Pages for this
      # repository" — Pages from a *private* repository requires GitHub Pro or
      # above. Until the repository is public (or the plan is upgraded), every
      # run will get this far, prove the build, and stop here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
